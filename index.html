<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI HUB - AI工具导航</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{padding:22px 8%;border-bottom:1px solid #26304a;font-size:24px;font-weight:bold;color:#91a5ff}
.hero{text-align:center;padding:70px 20px 45px}
h1{font-size:clamp(36px,7vw,60px);margin:20px 0}
h1 span{color:#91a5ff}
.hero p{color:#aab3ca;line-height:1.8}
input{width:min(100%,500px);padding:15px;border-radius:10px;border:1px solid #394461;background:#151d32;color:white;font-size:16px;margin-top:18px}
main{max-width:1000px;margin:auto;padding:20px}
h2{margin:20px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:#141c30;border:1px solid #293550;border-radius:14px;padding:24px}
.icon{font-size:32px}
.card p{color:#aab3ca;line-height:1.7;font-size:14px}
a{color:#9eafff;text-decoration:none}
a:hover{text-decoration:underline}
footer{text-align:center;color:#8994ad;padding:35px 15px;margin-top:40px;border-top:1px solid #26304a;font-size:13px}
</style>
</head>
<body>
<header>✦ AI HUB</header>
<section class="hero">
<h1>让 AI 帮你<br><span>做更多的事</span></h1>
<p>发现实用的人工智能工具，提高学习、工作与创作效率。</p>
<input id="search" placeholder="搜索工具，例如：写作、编程、设计">
</section>
<main>
<h2>探索 AI 工具</h2>
<div class="grid" id="grid">
<div class="card"><div class="icon">🤖</div><h3>ChatGPT</h3><p>学习、写作、分析和解决问题。</p><a href="https://chatgpt.com/" target="_blank">立即使用 ↗</a></div>
<div class="card"><div class="icon">🔎</div><h3>Perplexity</h3><p>搜索信息、研究主题和查找资料。</p><a href="https://www.perplexity.ai/" target="_blank">立即使用 ↗</a></div>
<div class="card"><div class="icon">💻</div><h3>GitHub</h3><p>学习编程、保存代码和开发网站。</p><a href="https://github.com/" target="_blank">立即使用 ↗</a></div>
<div class="card"><div class="icon">🎨</div><h3>Canva</h3><p>设计海报、图片和社交媒体内容。</p><a href="https://www.canva.com/" target="_blank">立即使用 ↗</a></div>
<div class="card"><div class="icon">🌐</div><h3>DeepL</h3><p>辅助翻译文本和理解不同语言。</p><a href="https://www.deepl.com/" target="_blank">立即使用 ↗</a></div>
<div class="card"><div class="icon">⚡</div><h3>AI 编程</h3><p>了解人工智能如何辅助编写代码。</p><a href="https://github.com/features/copilot" target="_blank">了解更多 ↗</a></div>
</div>
</main>
<footer>© 2026 AI HUB · 让技术服务于创造</footer>
<script>
document.getElementById('search').addEventListener('input',function(){
const q=this.value.toLowerCase();
document.querySelectorAll('.card').forEach(card=>{
card.style.display=card.innerText.toLowerCase().includes(q)?'':'none';
});
});
</script>
</body>
</html>
